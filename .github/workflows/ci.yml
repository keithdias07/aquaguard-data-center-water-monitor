name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -v

  extension:
    name: Extension (unit, eval, package, Chrome e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Evaluation (fails if any meaning check fails)
        run: npm run eval
      - name: Build and verify extension ZIP
        run: python ../scripts/package_extension.py --check
      - name: End-to-end tests in Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aquaguard-prompt-optimizer
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: extension/eval/results/
          if-no-files-found: ignore
