<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaGuard Prompt Optimizer</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="row">
      <div class="brand">
        <img src="../icons/icon48.png" alt="">
        <div>
          <div class="name">AquaGuard</div>
          <div class="sub">Prompt Optimizer</div>
        </div>
      </div>
      <span id="status-badge" class="badge off">Off</span>
    </header>

    <section class="card stack">
      <div class="row">
        <label for="toggle-enabled"><strong>Optimization</strong><br><span class="muted small" id="enabled-help">Enabled on supported sites</span></label>
        <span class="switch"><input type="checkbox" id="toggle-enabled" role="switch"><span class="track"></span></span>
      </div>
      <div class="row">
        <label for="apply-mode"><strong>Mode</strong></label>
        <select id="apply-mode" aria-describedby="mode-help">
          <option value="manual">Preview, then Apply</option>
          <option value="previewOnly">Preview only</option>
          <option value="autoApply">Auto-apply after pause</option>
        </select>
      </div>
      <p id="mode-help" class="muted small"></p>
    </section>

    <section class="card stack" id="site-card">
      <div class="row">
        <div>
          <strong id="site-name">This tab</strong>
          <div class="muted small" id="site-detail">Checking…</div>
        </div>
        <span class="switch" id="site-switch-wrap" hidden><input type="checkbox" id="toggle-site" role="switch" aria-label="Enable on this site"><span class="track"></span></span>
      </div>
    </section>

    <section class="card stack" id="result-card" hidden>
      <div class="metrics">
        <div class="metric"><b id="m-orig">–</b><span>Original tokens</span></div>
        <div class="metric"><b id="m-opt">–</b><span>Optimized tokens</span></div>
        <div class="metric good"><b id="m-saved">–</b><span>Tokens saved</span></div>
        <div class="metric good"><b id="m-pct">–</b><span>Reduction</span></div>
      </div>
      <p class="muted small" id="m-note"></p>
      <p class="small" id="m-message" role="status" aria-live="polite"></p>
      <div class="actions">
        <button class="btn" id="btn-optimize" type="button">Optimize now</button>
        <button class="btn primary" id="btn-apply" type="button">Apply</button>
        <button class="btn" id="btn-undo" type="button">Undo</button>
      </div>
    </section>

    <footer class="row small">
      <span class="muted">Runs locally. Never sends prompts for you.</span>
      <a href="#" id="open-options">Settings &amp; statistics</a>
    </footer>
  </main>

  <script src="../src/engine/impact.js"></script>
  <script src="../src/shared/settings.js"></script>
  <script src="../src/content/adapters.js"></script>
  <script src="popup.js"></script>
</body>
</html>
